# Publishes the site on every push to main. render.js writes Home and draws the whole version list into Clients,
# render-media.js draws the gallery and a page per picture, beside their thumbnails and the pictures themselves, and
# render-articles.js, render-sites.js, render-items.js, render-creatures.js, render-skills.js, render-auction.js, render-halloffame.js and render-societies.js draw the Articles, Sites, Items, Creatures, Skills, Auction, Hall of Fame and Societies pages. The folder they write is what GitHub Pages serves, so every page reads in
# full without JavaScript and web archives keep all of it. Nothing needs running by hand. A mistake in versions.json,
# notes.md, media.json, articles.json, sites.json, the items, creatures or auction data, or a missing picture, stops the publish and the last good version stays up;
# the Publish run on the Actions tab lists the mistake.
#
# The repository's Settings > Pages > Build and deployment > Source must be set to "GitHub Actions".
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node render.js _site
      - run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python media/thumbs.py _site
      - run: node media/render-media.js _site
      - run: cp -r media/files _site/media/files
      - run: node articles/render-articles.js _site
      - run: node sites/render-sites.js _site
      - run: node items/render-items.js _site
      - run: node creatures/render-creatures.js _site
      - run: node skills/render-skills.js _site
      - run: node auction/render-auction.js _site
      - run: node halloffame/render-halloffame.js _site
      - run: node societies/render-societies.js _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
