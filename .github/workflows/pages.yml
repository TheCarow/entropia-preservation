# Publishes the site on every push to main. render.js draws the whole version list into index.html, and the folder it
# writes is what GitHub Pages serves, so the published page reads in full without JavaScript and web archives keep all
# of it. Nothing needs running by hand. A mistake in versions.json or notes.md stops the publish and the last good
# version stays up; the Publish run on the Actions tab lists the mistake.
#
# The repository's Settings > Pages > Build and deployment > Source must be set to "GitHub Actions".
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node render.js _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
